
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="DAY6-student.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Please fill in your details below</p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number"
                       pattern="[0-9]{10}"
                       maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="options">
                    <label>
                        <input type="radio" name="gender"
                               value="Male" required> Male
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Female"> Female
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Other"> Other
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" name="course" required>
                    <option value="">-- Choose a course --</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BSc">B.Sc.</option>
                    <option value="BCom">B.Com.</option>
                    <option value="MCA">MCA</option>
                    <option value="MBA">MBA</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address"
                          rows="4"
                          placeholder="Enter your address"
                          required></textarea>
            </div>

            <div class="form-group">
                <label for="qualification">Previous Qualification</label>
                <input type="text" id="qualification"
                       name="qualification"
                       placeholder="e.g. 12th Pass or Graduation"
                       required>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="terms"
                           required>
                    I confirm that the details provided are correct.
                </label>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">
                    Register
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>
    </div>

</body>
</html>
