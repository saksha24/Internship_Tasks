
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Webpage</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="container">
        <h1>Interactive Webpage</h1>
        <p>Learn how HTML, CSS, and JavaScript work together.</p>

        <!-- Button Click Event -->
        <section class="card">
            <h2>Button Click Event</h2>
            <p>You clicked the button <strong id="count">0</strong> times.</p>
            <button id="clickBtn">Click Me!</button>
            <button id="resetBtn" class="secondary">Reset Counter</button>
        </section>

        <!-- Form Submission Event -->
        <section class="card">
            <h2>User Registration Form</h2>

            <form id="userForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <button type="submit">Submit Form</button>
            </form>

            <div id="result" class="result" hidden></div>
        </section>

        <!-- Dynamic Data -->
        <section class="card">
            <h2>Dynamic Date and Time</h2>
            <p id="dateTime">Loading...</p>
            <button id="refreshBtn">Refresh Time</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
